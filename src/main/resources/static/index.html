<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hera</title>
    <style>
        body {
            font-family: monospace;
            font-size: 18px;
            background: #f0f0f0;
            color: #000;
            margin: 20px;
            line-height: 1.5;
            text-transform: lowercase; /* forces all text to lowercase */
        }
        h1, h2, h3 {
            font-weight: bold;
            margin-bottom: 10px;
        }
        hr {
            border: 0;
            border-top: 2px solid #000;
            margin: 20px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }
        input, select, button {
            font-family: monospace;
            font-size: 18px;
            border: 1px solid #000;
            background: #fff;
            padding: 4px;
            text-transform: lowercase;
        }
        button {
            cursor: pointer;
            background: #ddd;
        }
        button:hover {
            background: #ccc;
        }
        .hidden {
            display: none;
        }
        pre {
            background: #e0e0e0;
            border: 1px solid #000;
            padding: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
        }
        a {
            color: blue;
            text-decoration: underline;
        }
        .status-bar {
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<h1>hera</h1>
<div class="status-bar">ws: <span id="ws-text">connecting...</span></div>

<hr>

<!-- settings -->
<details>
    <summary><b>settings</b></summary>
    <div style="margin-top: 10px; padding: 10px; border: 1px solid #000; background: #fff;">
        <fieldset>
            <legend>configuration</legend>
            <label>last.fm api key:</label><br>
            <input type="password" id="set-lastfm-key" style="width: 100%; margin-bottom: 10px;"><br>

            <label>last.fm username:</label><br>
            <input type="text" id="set-lastfm-user" style="width: 100%; margin-bottom: 10px;"><br>

            <label>max daily downloads:</label>
            <input type="number" id="set-max-downloads" min="1" max="500" style="width: 80px; margin-bottom: 10px;"><br>

            <label>format:</label>
            <select id="set-format">
                <option value="mp3">mp3</option>
                <option value="m4a">m4a</option>
                <option value="opus">opus</option>
            </select>

            <label>bitrate:</label>
            <select id="set-bitrate">
                <option value="320">320</option>
                <option value="256">256</option>
                <option value="192">192</option>
                <option value="128">128</option>
            </select><br><br>

            <input type="checkbox" id="set-organize">
            <label for="set-organize">organize by artist</label><br>

            <input type="checkbox" id="set-lyrics">
            <label for="set-lyrics">download lyrics</label><br><br>

            <button onclick="saveSettings()">save settings</button>
        </fieldset>
    </div>
</details>

<hr>

<!-- search -->
<h2>find music</h2>
<div>
    <label>strategy:</label>
    <select id="strategy" onchange="toggleSeedInput()">
        <option value="HYBRID">hybrid (my profile)</option>
        <option value="USER_PERSONALIZED">my top artists</option>
        <option value="NOW_LISTENING">now listening</option>
        <option value="GENRE_BASED">my top genres</option>
        <option value="ARTIST_SIMILARITY">by artist</option>
        <option value="TRACK_SIMILARITY">by track</option>
        <option value="TAG_BASED">by tag</option>
    </select>

    <label>limit:</label>
    <input type="number" id="limit" value="20" min="1" max="100" style="width: 60px;">

    <div id="seed-group" class="hidden" style="margin-top: 10px;">
        <label id="seed-label">search term:</label><br>
        <input type="text" id="seed" style="width: 100%;">
    </div>

    <br><br>
    <button id="search-btn" onclick="searchRecommendations()">search</button>
</div>

<hr>

<!-- results -->
<h2>recommendations</h2>
<div id="results-actions" class="hidden" style="margin-bottom: 10px;">
    <button onclick="selectAll(true)">select all</button>
    <button onclick="selectAll(false)">deselect all</button>
    <button onclick="downloadSelected()">download selected</button>
</div>
<div id="results-table">
    <p>no results yet.</p>
</div>

<hr>

<!-- progress -->
<h2>download progress</h2>
<pre id="progress-feed">no active downloads.</pre>
<button onclick="clearProgress()">clear log</button>

<hr>

<!-- library -->
<h2>library</h2>
<button onclick="refreshLibrary()">refresh library</button>
<div id="library-list" style="margin-top: 10px;">
    <p>click refresh to load.</p>
</div>

<hr>
<div id="status-text"></div>

<script>
    let recommendations = [];
    let ws = null;

    // ─── websocket ───
    function connectWS() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/progress`;
        ws = new WebSocket(wsUrl);

        ws.onopen = () => { document.getElementById('ws-text').innerText = 'connected'; };
        ws.onclose = () => {
            document.getElementById('ws-text').innerText = 'disconnected';
            setTimeout(connectWS, 3000);
        };
        ws.onerror = () => { document.getElementById('ws-text').innerText = 'error'; };
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                handleWSMessage(data);
            } catch (e) {
                logProgress("ws: " + event.data);
            }
        };
    }

    function handleWSMessage(data) {
        if (data.type === 'batch_complete') {
            const msg = `batch complete: ${data.downloaded} downloaded, ${data.failed} failed`;
            logProgress(msg);
            refreshLibrary();
            return;
        }

        const song = data.song || {};
        const songName = (song.artist && song.title) ? `${song.artist} - ${song.title}` :
                         song.name || data.filename || data.message || 'unknown track';
        const status = data.status || 'unknown';
        const progress = data.progress || 0;

        logProgress(`[${status}] ${songName} (${progress}%)`);
    }

    function logProgress(message) {
        const feed = document.getElementById('progress-feed');
        feed.innerText = message + "\n" + feed.innerText;
    }

    function clearProgress() {
        document.getElementById('progress-feed').innerText = 'no active downloads.';
    }

    // ─── ui logic for seed input ───
    function toggleSeedInput() {
        const strategy = document.getElementById('strategy').value;
        const seedGroup = document.getElementById('seed-group');
        const seedLabel = document.getElementById('seed-label');
        const seedInput = document.getElementById('seed');

        const manualStrategies = ['ARTIST_SIMILARITY', 'TRACK_SIMILARITY', 'TAG_BASED'];

        if (manualStrategies.includes(strategy)) {
            seedGroup.classList.remove('hidden');
            if (strategy === 'ARTIST_SIMILARITY') {
                seedLabel.innerText = 'artist name:';
                seedInput.placeholder = 'radiohead';
            } else if (strategy === 'TRACK_SIMILARITY') {
                seedLabel.innerText = 'artist - track:';
                seedInput.placeholder = 'radiohead - paranoid android';
            } else if (strategy === 'TAG_BASED') {
                seedLabel.innerText = 'genre tag:';
                seedInput.placeholder = 'shoegaze';
            }
        } else {
            seedGroup.classList.add('hidden');
            seedInput.value = '';
        }
    }

    // ─── api calls ───
    async function searchRecommendations() {
        const strategy = document.getElementById('strategy').value;
        const seed = document.getElementById('seed').value.trim();
        const limit = parseInt(document.getElementById('limit').value);

        const manualStrategies = ['ARTIST_SIMILARITY', 'TRACK_SIMILARITY', 'TAG_BASED'];
        if (manualStrategies.includes(strategy) && !seed) {
            alert('enter a search term');
            return;
        }

        const btn = document.getElementById('search-btn');
        btn.disabled = true;
        btn.innerText = 'searching...';

        try {
            const response = await fetch(buildSearchUrl(strategy, seed, limit));
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            recommendations = await response.json();
            renderResults(recommendations);
        } catch (e) {
            alert(`search failed: ${e.message}`);
        } finally {
            btn.disabled = false;
            btn.innerText = 'search';
        }
    }

    function buildSearchUrl(strategy, seed, limit) {
        switch (strategy) {
            case 'USER_PERSONALIZED':
                return `/api/recommend/personal?username=${encodeURIComponent(seed)}&limit=${limit}`;
            case 'NOW_LISTENING':
                return `/api/recommend/now?username=${encodeURIComponent(seed)}&limit=${limit}`;
            case 'GENRE_BASED':
                return `/api/recommend/genres?username=${encodeURIComponent(seed)}&limit=${limit}`;
            case 'HYBRID':
                return `/api/recommend/hybrid?username=${encodeURIComponent(seed)}&limit=${limit}`;
            case 'TRACK_SIMILARITY':
                const parts = seed.split(' - ');
                if (parts.length < 2) { alert('format: artist - track'); throw new Error('invalid format'); }
                return `/api/recommend/track?artist=${encodeURIComponent(parts[0].trim())}&track=${encodeURIComponent(parts[1].trim())}&limit=${limit}`;
            case 'TAG_BASED':
                return `/api/recommend/tag?tag=${encodeURIComponent(seed)}&limit=${limit}`;
            case 'ARTIST_SIMILARITY':
                return `/api/recommend?artist=${encodeURIComponent(seed)}&limit=${limit}`;
            default:
                return `/api/recommend?artist=${encodeURIComponent(seed)}&limit=${limit}`;
        }
    }

    function renderResults(recs) {
        const table = document.getElementById('results-table');

        if (recs.length === 0) {
            table.innerHTML = '<p>no recommendations found. check settings.</p>';
            document.getElementById('results-actions').classList.add('hidden');
            return;
        }

        document.getElementById('results-actions').classList.remove('hidden');

        let html = `<table>
            <thead><tr>
                <th>dl?</th>
                <th>artist</th>
                <th>track</th>
                <th>match</th>
                <th>listeners</th>
            </tr></thead><tbody>`;

        recs.forEach((r, i) => {
            const pct = Math.round(r.matchScore * 100);
            const listeners = r.listenerCount.toLocaleString();
            html += `<tr>
                <td><input type="checkbox" class="track-check" data-index="${i}"></td>
                <td>${escapeHtml(r.track.artist)}</td>
                <td>${escapeHtml(r.track.title)}</td>
                <td>${pct}%</td>
                <td>${listeners}</td>
            </tr>`;
        });
        html += '</tbody></table>';
        table.innerHTML = html;
    }

    async function downloadSelected() {
        const selected = [];
        document.querySelectorAll('.track-check:checked').forEach(cb => {
            const idx = parseInt(cb.dataset.index);
            if (recommendations[idx]) {
                selected.push({
                    artist: recommendations[idx].track.artist,
                    title: recommendations[idx].track.title,
                    spotifyUrl: null,
                    duration: null
                });
            }
        });

        if (selected.length === 0) { alert('select at least one track'); return; }

        try {
            const response = await fetch('/api/download/tracks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tracks: selected })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            logProgress(`started download of ${selected.length} tracks...`);
        } catch (e) {
            alert(`download failed: ${e.message}`);
        }
    }

    async function refreshLibrary() {
        const list = document.getElementById('library-list');
        list.innerHTML = '<p>loading...</p>';
        try {
            const response = await fetch('/api/library');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const files = await response.json();
            renderLibrary(files);
        } catch (e) {
            list.innerHTML = `<p>error: ${e.message}</p>`;
        }
    }

    function renderLibrary(files) {
        const list = document.getElementById('library-list');
        if (files.length === 0) {
            list.innerHTML = '<p>no files downloaded yet.</p>';
            return;
        }
        let html = '<ul>';
        files.forEach(f => {
            const name = f.split('/').pop();
            html += `<li>${escapeHtml(name)}</li>`;
        });
        html += '</ul>';
        list.innerHTML = html;
    }

    // ─── settings ───
    async function openSettings() {
        try {
            const response = await fetch('/api/settings');
            if (!response.ok) throw new Error('failed to load settings');
            const s = await response.json();

            document.getElementById('set-lastfm-key').value = s.lastfmApiKey || '';
            document.getElementById('set-lastfm-user').value = s.lastfmUsername || '';
            document.getElementById('set-max-downloads').value = s.maxDailyDownloads || 50;
            document.getElementById('set-format').value = s.format || 'mp3';
            document.getElementById('set-bitrate').value = s.bitrate || '320';
            document.getElementById('set-organize').checked = s.organizeByArtist || false;
            document.getElementById('set-lyrics').checked = s.downloadLyrics || false;
        } catch (e) {
            console.error('error loading settings:', e);
        }
    }

    async function saveSettings() {
        const s = {
            lastfmApiKey: document.getElementById('set-lastfm-key').value.trim(),
            lastfmUsername: document.getElementById('set-lastfm-user').value.trim(),
            maxDailyDownloads: parseInt(document.getElementById('set-max-downloads').value),
            format: document.getElementById('set-format').value,
            bitrate: document.getElementById('set-bitrate').value,
            organizeByArtist: document.getElementById('set-organize').checked,
            downloadLyrics: document.getElementById('set-lyrics').checked
        };

        try {
            const response = await fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(s)
            });
            if (!response.ok) throw new Error('failed to save settings');
            alert('settings saved!');
        } catch (e) {
            alert(`error saving settings: ${e.message}`);
        }
    }

    // ─── ui helpers ───
    function selectAll(checked) {
        document.querySelectorAll('.track-check').forEach(cb => cb.checked = checked);
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    // ─── init ───
    window.addEventListener('DOMContentLoaded', () => {
        connectWS();
        toggleSeedInput();
        openSettings();
    });
</script>

</body>
</html>
